name: reward-ledger

# 流量奖励的公开账本:定时把登记服务出的账本提交到 rewards 分支(ledger.json)。
# 没绑定地址的面板只读这个分支上的文件;分支的提交历史就是奖池和积分每一次变动的公开记录,谁都能翻、能比对。
#
# 这个文件放在 deploy/reward/ 里的时候不会运行。上线时(登记服务部署好之后)复制成 .github/workflows/reward-ledger.yml。
# GitHub 的定时任务只是尽力而为:这里写的一刻钟一次,实际可能隔得更久;账本晚一点更新不影响积分和奖池本身(都在登记服务里)。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reward-ledger
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 取出 rewards 分支(头一次没有,就地新建一个只放账本的空分支)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" rewards >/dev/null 2>&1; then
            git clone -q --depth 1 --branch rewards "$url" ledger-data
          else
            mkdir ledger-data && git -C ledger-data init -q -b rewards && git -C ledger-data remote add origin "$url"
            printf '%s\n' '# m-ui 流量奖励的公开账本' '' 'ledger.json 由登记服务生成、定时提交(.github/workflows/reward-ledger.yml),提交前先过一遍 deploy/reward/check-ledger.mjs。' '每一笔入账都带着链上的交易号,可以拿到区块浏览器上核对;这个分支的提交历史就是奖池和积分每一次变动的记录。' > ledger-data/README.md
          fi
      - name: 取账本、核对、提交
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 5 -o new.json https://reward.godusevpn.org/v1/export
          code=0
          node deploy/reward/check-ledger.mjs new.json ledger-data/ledger.json || code=$?
          if [ "$code" = 3 ]; then exit 0; fi   # 和分支上的一样,不用提交
          if [ "$code" != 0 ]; then
            echo "::error::登记服务出的账本没通过核对,这一轮不提交(分支上还是上一份)"
            exit 1
          fi
          cp new.json ledger-data/ledger.json
          git -C ledger-data add -A
          if git -C ledger-data diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git -C ledger-data -c user.name=Maoyangui -c user.email=324171816+Maoyangui@users.noreply.github.com commit -q -m "更新流量奖励账本"
          for try in 1 2 3; do
            if git -C ledger-data push -q origin HEAD:rewards; then exit 0; fi
            echo "::warning::第 $try 次推送失败"
            sleep $((try * 10))
          done
          echo "::error::推送 3 次都失败,这一轮的账本没有提交(下一轮会带上)"
          exit 1

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>m-ui</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='18' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%23fff'%3Em%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand"><span class="logo">m</span><span>m-ui</span></div>
    <h1 id="login-title"></h1>
    <label class="field"><span class="label" id="login-user-label"></span><input id="lg-user" autocomplete="username" required></label>
    <label class="field"><span class="label" id="login-pass-label"></span><input id="lg-pass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit" id="login-submit"></button>
    <div id="lg-err" class="err"></div>
  </form>
</div>

<!-- 应用壳 -->
<div id="app" class="shell" hidden>
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">m</span><span class="brand-name">m-ui</span><span id="role-badge" class="badge"></span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost sm" id="btn-theme" title="主题">◐</button>
      <select id="lang-select" class="sm" title="Language"></select>
      <button class="btn ghost sm" id="btn-logout"></button>
    </div>
    <div class="sidebar-version" id="sidebar-version"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="btn-menu" class="btn ghost icon" aria-label="menu">☰</button>
      <div class="topbar-title"><h1 id="page-title"></h1><p id="page-subtitle" class="subtitle"></p></div>
      <div id="topbar-right"></div>
    </header>
    <main id="page"></main>
  </div>
</div>

<!-- 抽屉 -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h2 id="drawer-title"></h2><button class="btn ghost icon" id="drawer-close" aria-label="close">✕</button></div>
  <div id="drawer-body" class="drawer-body"></div>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel"></button>
      <button class="btn primary" id="modal-save"></button>
    </div>
    <div id="modal-err" class="err"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/* 1200×630 的 OpenGraph 分享图:logo + 一句定位 + 概览截图。由 render.mjs 用无头 Chrome 拍成 og.png */
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0f1216; color: #e6e9ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; position: relative; }
.bg { position: absolute; inset: 0; background: radial-gradient(900px 500px at 15% 10%, #1e3a8a55, transparent 60%), radial-gradient(700px 400px at 100% 100%, #2563eb33, transparent 60%); }
.left { position: absolute; left: 64px; top: 64px; width: 500px; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { width: 72px; height: 72px; }
.brand span { font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
h1 { font-size: 40px; line-height: 1.15; margin: 34px 0 18px; letter-spacing: -.02em; }
p { font-size: 22px; line-height: 1.45; color: #aab4c3; margin: 0; }
.tags { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
.tags span { font-size: 16px; padding: 6px 12px; border: 1px solid #2a313b; border-radius: 999px; color: #cbd5e1; background: #171b21; }
.shot { position: absolute; right: -40px; top: 110px; width: 700px; border-radius: 14px; overflow: hidden; border: 1px solid #2a313b; box-shadow: 0 30px 80px -20px #000; transform: perspective(1400px) rotateY(-8deg); background: #fff; }
.shot img { display: block; width: 100%; }
.url { position: absolute; left: 64px; bottom: 44px; font-size: 20px; color: #64748b; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="left">
  <div class="brand"><img src="../../brand/logo.svg" alt=""><span>m-ui</span></div>
  <h1>Embedded sing-box<br>multi-server panel</h1>
  <p>One binary. Hot user reload. Validated config with rollback. One master, any number of nodes.</p>
  <div class="tags"><span>Hysteria2</span><span>AnyTLS</span><span>Reality</span><span>TUIC</span><span>Shadowsocks 2022</span><span>Resellers</span></div>
</div>
<div class="shot"><img src="../../docs/screenshots/dashboard-en.png" alt=""></div>
<div class="url">maoyangui.github.io/m-ui</div>
</body>
</html>

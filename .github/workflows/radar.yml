name: radar

# 每周一次:找外链机会(仍在维护、与 sing-box / 代理面板相关的 awesome 列表,以及它们的收录规则信号)
# 和第三方提及(GitHub 上提到本仓库或站点的地方)。结果只存为 artifact 和运行摘要,不写进仓库。
# 向别人仓库开 PR 需要能 fork 的令牌,Actions 的 GITHUB_TOKEN 做不到,所以这里只产出判断,不自动投递。
on:
  schedule:
    - cron: "23 3 * * 1" # 每周一 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/tools/radar.mjs > radar.json
      - uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_id }}
          path: radar.json
          retention-days: 90
      # 摘要只按 radar.mjs 当前的输出取值,缺字段写"未知"、读不到文件也只写进摘要,这一步不会让工作流失败
      - name: Summary
        run: node site/tools/radar-summary.mjs radar.json >> "$GITHUB_STEP_SUMMARY"

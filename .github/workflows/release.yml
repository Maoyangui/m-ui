name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  actions: write # 发布后显式触发 pages 工作流刷新 feed.xml

jobs:
  # 发布与营销严格分开:自上一个标签以来只有站点 / 截图 / README / 内容类工作流有改动,就不构建、不发布、不公告。
  # 产品路径(Go 代码、web/assets、deploy/、go.mod 等)有改动才往下走。
  scope:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$prev" "$GITHUB_REF_NAME")"
          product="$(printf '%s\n' "$changed" | grep -Ev '^(site/|docs/|README(\.en)?\.md$|\.github/workflows/(pages|content|radar|install-test)\.yml$|\.github/ISSUE_TEMPLATE/|\.github/DISCUSSION_TEMPLATE/)' || true)"
          if [ -z "$product" ]; then
            echo "自 $prev 以来只有站点 / 文档 / 内容改动,不发布 Release:"; printf '%s\n' "$changed"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "产品路径有改动,发布:"; printf '%s\n' "$product" | head -20
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 发布说明要列出自上一个标签以来的改动

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - name: Tests (含全协议 sing-box 干跑)
        run: go test -tags with_utls ./...

      - name: Build linux amd64 / arm64 (纯 Go,无 CGO,静态单二进制)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -tags with_utls -trimpath -ldflags "-w -s -X main.version=${{ steps.ver.outputs.v }}" -o dist/$arch/m-ui .
            tar -C dist/$arch -czf m-ui-linux-$arch.tar.gz m-ui
          done
          sha256sum m-ui-linux-*.tar.gz > SHA256SUMS

      - name: Smoke test (本机构建可运行)
        run: |
          go build -tags with_utls -ldflags "-X main.version=${{ steps.ver.outputs.v }}" -o /tmp/m-ui-host .
          /tmp/m-ui-host version

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: m-ui-linux
          path: |
            m-ui-linux-*.tar.gz
            SHA256SUMS

      # 发布说明:自上一个标签以来的提交标题(中文)+ 安装 / 升级命令 + 文档与完整变更链接。
      # 两种语言的固定部分都在,改动列表取自提交标题,不需要人手写公告。
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..${GITHUB_REF_NAME}"; else range="${GITHUB_REF_NAME}"; fi
          changes="$(git log --no-merges --pretty='- %s' "$range" | grep -v '^- Merge' | head -40)"
          [ -n "$changes" ] || changes="- (no changes listed)"
          {
            echo "**m-ui** 是 Maoyangui 开源的 sing-box 面板:内嵌内核、一个 Go 二进制、一主多副。这是它的 ${GITHUB_REF_NAME} 版本。"
            echo "**m-ui** is the embedded sing-box multi-server panel by Maoyangui, one Go binary. This is release ${GITHUB_REF_NAME}. Website: https://maoyangui.github.io/m-ui/ · About: https://maoyangui.github.io/m-ui/about/"
            echo
            echo "## 这个版本 · What's new"
            echo
            echo "$changes"
            echo
            echo "## 安装 / 升级 · Install / upgrade"
            echo
            echo '```bash'
            echo 'bash <(curl -fsSL https://raw.githubusercontent.com/Maoyangui/m-ui/main/deploy/install.sh)'
            echo '```'
            echo
            echo "已在跑的面板:左下角版本号旁的更新箭头,或命令行 \`m-ui\` 菜单里选「更新到最新版」。数据库、证书与设置都不动。"
            echo "Already running m-ui? Click the update arrow next to the version in the sidebar, or pick \"Update\" in the \`m-ui\` menu. Database, certificates and settings are untouched."
            echo
            echo "## 校验 · Verify"
            echo
            echo "\`SHA256SUMS\` 与压缩包在同一个 Release 里;安装脚本和面板内更新都会先校验再替换。"
            echo "\`SHA256SUMS\` ships with the archives; the installer and in-panel updater verify before replacing the binary."
            echo
            echo "## 链接 · Links"
            echo
            echo "- 文档 · Docs: https://maoyangui.github.io/m-ui/"
            if [ -n "$prev" ]; then echo "- 完整变更 · Full changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"; fi
            echo "- 提问 · Questions: https://github.com/${GITHUB_REPOSITORY}/discussions"
          } > RELEASE_NOTES.md
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "m-ui ${{ github.ref_name }} · sing-box panel"
          body_path: RELEASE_NOTES.md
          files: |
            m-ui-linux-amd64.tar.gz
            m-ui-linux-arm64.tar.gz
            SHA256SUMS

      # Release 之后自动在 Discussions → Announcements 发一条公告(版本、改动、升级方式、链接)。
      # 分类按名字现查,仓库里没有该分类就跳过,不让发布失败。
      - name: Announce in Discussions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo_id="$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id}}' -f o="${GITHUB_REPOSITORY_OWNER}" -f n="${GITHUB_REPOSITORY#*/}" --jq '.data.repository.id')"
          cat_id="$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussionCategories(first:20){nodes{id name}}}}' -f o="${GITHUB_REPOSITORY_OWNER}" -f n="${GITHUB_REPOSITORY#*/}" --jq '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id' | head -1)"
          if [ -z "$cat_id" ]; then echo "没有 Announcements 分类,跳过公告"; exit 0; fi
          title="m-ui ${GITHUB_REF_NAME} 发布 · released"
          body="$(printf 'Release: https://github.com/%s/releases/tag/%s\n\n' "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"; cat RELEASE_NOTES.md)"
          url="$(gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$repo_id" -f c="$cat_id" -f t="$title" -f b="$body" --jq '.data.createDiscussion.discussion.url')"
          echo "公告: $url"
          if [ -n "$url" ]; then
            echo "- 公告 · Announcement: $url" >> RELEASE_NOTES.md
            gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md || echo "回填公告链接失败(不影响发布)"
          fi

      # GITHUB_TOKEN 创建的 Release 不会触发别的工作流(GitHub 防递归),
      # 所以在这里显式触发一次 pages,让站点的 feed.xml 带上这个版本。
      - name: Refresh site feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "触发 pages 失败(不影响发布)"

name: tests

# 产品代码的持续测试:push / PR 触及 Go 代码或前端就跑 go vet + 全部测试(含全协议 sing-box 干跑)并确认能构建。
# 只测不发:发布只在 release.yml 里由标签触发。
on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "web/**", "deploy/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", "web/**", "deploy/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 格式:gofmt 不干净就失败(Linux 上跑,行尾是 LF;Windows 检出的 CRLF 会让 gofmt -l 把每个文件都报出来)
      - name: Format
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "gofmt 不干净,请对这些文件跑 gofmt -w:"; echo "$bad"; exit 1; fi
      - name: Vet
        run: go vet -tags with_utls ./...
      - name: Tests
        run: go test -tags with_utls ./...
      # 竞态检测:并发的地方不少(数据面限速器、主副同步、巡检、会话),
      # 本地 Windows 上跑不了(-race 需要 cgo),放在 CI 里每次都跑。
      # runner 里真把 sing-box 起起来的用例(group_reload_test.go)带 //go:build !race,在这一步跳过:
      # sing-box 起停实例时有上游库自己的竞态,会淹掉真正要看的报告;runner 其余用例照跑。
      # ha 在主机容灾分支合并后加进来。
      - name: Tests (race)
        run: go test -race -tags with_utls ./core/... ./hub/... ./monitor/... ./reach/... ./web/... ./runner/... ./sub/... ./acme/... ./ext/...
      - name: Build (linux amd64 / arm64)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags with_utls -trimpath -ldflags "-w -s" -o /tmp/m-ui-$arch .
          done
      - name: Donors settle
        run: node --test deploy/donors/settle.test.mjs
      - name: Frontend (landing page logo upload)
        run: node --test web/jstest/logo.test.mjs
      - name: Frontend (external nodes page)
        run: node --test web/jstest/exts.test.mjs
      - name: Frontend (users page plan dialogs)
        run: node --test web/jstest/users.test.mjs
      - name: Frontend (support page)
        run: node --test web/jstest/support.test.mjs
      - name: Frontend (lines page IP version)
        run: node --test web/jstest/lines.test.mjs
      - name: Frontend (reachability and IPv6 inbound per line)
        run: node --test web/jstest/reach.test.mjs
      - name: Frontend (i18n zh / en keys and placeholders)
        run: node --test web/jstest/i18n.test.mjs
      - name: Frontend (recent inbound connections fair per server)
        run: node --test web/jstest/fair.test.mjs
      - name: Frontend (certificate and restore alert bars)
        run: node --test web/jstest/certbar.test.mjs
      - name: Frontend (help link on the login page)
        run: node --test web/jstest/helplink.test.mjs
      - name: Frontend (subscription http / https switch warning)
        run: node --test web/jstest/subtls.test.mjs
      - name: Frontend (dashboard issue rules, chip folding, audit text)
        run: node --test web/jstest/issues.test.mjs
      - name: Frontend (line picker write-back)
        run: node --test web/jstest/linepicker.test.mjs
      - name: Frontend (dropdown menus close on item click and under dialogs)
        run: node --test web/jstest/menu.test.mjs
      - name: Installer syntax
        run: bash -n deploy/install.sh && bash deploy/install.sh --uninstall --dry-run
